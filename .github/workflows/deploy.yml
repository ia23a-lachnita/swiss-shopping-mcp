name: Deploy to Pi

on:
  # Every green CI run on main deploys itself. Deploying used to be a manual
  # dispatch, which meant main could sit undeployed indefinitely and nobody
  # could tell from the outside what the Pi was actually running.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Kept for redeploying an arbitrary ref — a rollback to a known-good SHA, or
  # a retry after fixing something on the Pi itself.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: false
        default: main

concurrency:
  group: deploy-pi
  # Never interrupt a deploy in flight: it swaps the running container and can
  # roll back, and a half-applied swap is worse than a queued one.
  cancel-in-progress: false

env:
  IMAGE_REF: swiss-shopping-mcp:pi-slim
  DEPLOY_DIR: /srv/swiss-shopping-mcp

jobs:
  deploy:
    # A failed CI run still fires workflow_run, so the conclusion has to be
    # checked explicitly or a red main would deploy itself.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, arm64, pi]
    steps:
      - name: Checkout
        # workflow_run reports the commit CI actually tested, which is what
        # should be deployed — not whatever main has moved on to since.
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Re-runs the same gate as CI. Not redundant with it: workflow_dispatch
      # can target any branch/tag/SHA, which may never have passed CI at all,
      # and CI itself runs on ubuntu x64 while this is the arm64 machine the
      # code actually has to work on.
      - name: Verify (lint + test + build)
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

      - name: Build image (native arm64, no QEMU needed on this runner)
        run: docker buildx build --load -t swiss-shopping-mcp:build-${{ github.sha }} .

      - name: Flatten image
        run: |
          chmod +x scripts/docker-flatten.sh
          ./scripts/docker-flatten.sh swiss-shopping-mcp:build-${{ github.sha }} swiss-shopping-mcp:pi-slim-candidate

      - name: Promote candidate image (keep prior tag for rollback)
        run: |
          if docker image inspect "$IMAGE_REF" >/dev/null 2>&1; then
            docker tag "$IMAGE_REF" "${IMAGE_REF}-previous"
          fi
          docker tag swiss-shopping-mcp:pi-slim-candidate "$IMAGE_REF"

      - name: Sync compose file + deploy
        run: |
          sudo cp deploy/docker-compose.pi.yml "$DEPLOY_DIR/docker-compose.yml"
          sudo docker compose -f "$DEPLOY_DIR/docker-compose.yml" --project-directory "$DEPLOY_DIR" up -d --no-deps swiss-shopping

      - name: Health check (auto-rollback on failure)
        run: |
          chmod +x scripts/deploy-healthcheck.sh
          ./scripts/deploy-healthcheck.sh "$DEPLOY_DIR/docker-compose.yml" "$DEPLOY_DIR" swiss-shopping "$IMAGE_REF"

      - name: Tidy up build-only image tags
        if: always()
        run: |
          docker rmi swiss-shopping-mcp:build-${{ github.sha }} >/dev/null 2>&1 || true
          docker rmi swiss-shopping-mcp:pi-slim-candidate >/dev/null 2>&1 || true
