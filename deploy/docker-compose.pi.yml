# Production compose topology for the Raspberry Pi deployment.
#
# This file is the source of truth for /srv/swiss-shopping-mcp/docker-compose.yml
# on the Pi -- the deploy workflow (.github/workflows/deploy.yml) copies it into
# place on every run, so edit it HERE, not on the Pi directly.
#
# Secrets stay Pi-only and are never committed: `.env` and `.env.gluetun` must
# already exist in /srv/swiss-shopping-mcp (created once, by hand, during the
# original Pi setup -- see docs/active/PI deployment notes in the tracker).
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env.gluetun
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  swiss-shopping:
    image: swiss-shopping-mcp:pi-slim
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - cache:/data
    env_file:
      - .env
    environment:
      - SWISS_SHOPPING_WEB_SEARCH=${SWISS_SHOPPING_WEB_SEARCH:-auto}
    healthcheck:
      # Defined here (not just baked into the image) because the deploy
      # pipeline's docker-flatten.sh step re-imports the image without a
      # HEALTHCHECK -- `docker import --change` doesn't support it.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/source-status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    init: true

volumes:
  cache:
